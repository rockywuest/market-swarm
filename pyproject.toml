[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-swarm"
version = "1.0.0"
description = "LLM-powered multi-agent market simulation for product launches — simulate trade buyers, category managers and consumers before you ship."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Rocky Wüst" }]
keywords = [
    "llm",
    "multi-agent",
    "market-research",
    "simulation",
    "synthetic-research",
    "fmcg",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.42.0,<1.0",
    "openai>=1.60.0,<2.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "rich>=13.0,<15.0",
    "httpx>=0.27.0,<1.0",
    "python-dotenv>=1.0.0,<2.0",
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "fpdf2>=2.8.0,<3.0",
    "python-pptx>=1.0.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23.0,<1.0", "ruff>=0.6.0"]
population = ["datasets>=2.19"]

[project.urls]
Repository = "https://github.com/rockywuest/market-swarm"

[project.scripts]
market-swarm = "market_swarm.__main__:main"

[tool.setuptools.packages.find]
include = ["market_swarm*"]

[tool.setuptools.package-data]
market_swarm = ["industry_packs/*/pack.yaml", "industry_packs/*/personas/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
